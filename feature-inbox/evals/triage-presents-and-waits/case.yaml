schema_version: "1.1"
name: triage-presents-and-waits
expected_outcome: |
  The agent reads inbox #12 (found via the CLAUDE.local.md pointer) and presents the two open decisions,
  human-only Q-3 first: for each, a short 要点 drawn from the source comment, the options with their costs, a
  recommendation with a reason, and exactly what the user needs to say; Q-4 additionally notes the agent can decide it
  if delegated. 課題 / 引継ぎ are shown briefly as context, and the agent-made decision Q-5 (決定者: エージェント, unconfirmed) is listed as something the human can confirm or overturn. The turn then ends waiting for the user: no comment is
  posted, the body is not edited, no 決定 is recorded, and the issue is not closed.
context:
  scaffold_script: place-files.sh
